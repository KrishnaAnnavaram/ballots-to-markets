[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ballots-to-markets"
version = "0.1.0"
description = "Election sentiment, Fed policy and their link to market moves"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
fetch = ["yfinance>=0.2.40"]
nlp = ["transformers>=4.40", "torch>=2.1"]
deep = ["torch>=2.1"]
stats = ["statsmodels>=0.14"]
dev = ["pytest>=8"]

[project.scripts]
ballots-to-markets = "ballots_to_markets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ballots_to_markets = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
